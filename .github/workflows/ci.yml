name: CI

on:
  pull_request:
    branches: [master, main]

jobs:
  typecheck:
    name: Type Check and Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
